# Deploys dist/ to an S3 bucket fronted by CloudFront.
#
# The job is skipped until these repository *variables* (Settings ->
# Secrets and variables -> Actions -> Variables) are set:
#   AWS_ROLE_ARN                 IAM role GitHub may assume via OIDC
#   AWS_REGION                   e.g. us-west-2
#   S3_BUCKET                    bucket name that CloudFront serves
#   CLOUDFRONT_DISTRIBUTION_ID   distribution to invalidate after upload
#
# The role needs s3:ListBucket, s3:PutObject, s3:DeleteObject on the bucket
# and cloudfront:CreateInvalidation on the distribution, with a trust policy
# for token.actions.githubusercontent.com scoped to this repository.
#
# If the site turns out to be hosted on AWS Amplify instead, delete this file
# and connect the branch in the Amplify console; Amplify builds on push.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.S3_BUCKET != '' && vars.AWS_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Hashed assets can be cached for a year; index.html must always revalidate.
      - name: Upload hashed assets
        run: >-
          aws s3 sync dist/assets "s3://${{ vars.S3_BUCKET }}/assets"
          --delete --cache-control "public, max-age=31536000, immutable"
      - name: Upload everything else
        run: >-
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}"
          --exclude "assets/*" --delete
          --cache-control "public, max-age=0, must-revalidate"
      - name: Invalidate CloudFront
        if: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/*"
